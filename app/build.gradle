plugins {
    id 'com.android.application'
}

android {
    namespace 'com.poppymovies.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.poppymovies.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    flavorDimensions "device"
    productFlavors {
        phone {
            dimension "device"
        }
        firetv {
            dimension "device"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
